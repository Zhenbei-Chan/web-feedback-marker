<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>网页反馈标注器</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <img class="brand-mark" src="../assets/icons/icon-48.png" alt="" />
        <div class="hero-copy">
          <h1>网页反馈标注器</h1>
          <p>当前页面反馈收集与导出</p>
        </div>
        <button id="guideToggleBtn" class="help-button" type="button" aria-label="查看使用说明" aria-expanded="false" aria-controls="assistPanel">?</button>
      </header>

      <section class="page-context" aria-label="当前页面">
        <span>当前页面</span>
        <p id="pageTitle" class="page-title">读取页面中...</p>
        <p id="pageUrl" class="page-url"></p>
      </section>

      <section class="primary-actions" aria-label="主要操作">
        <button id="startAnnotationBtn" class="primary action-main" type="button">进入批注模式</button>
      </section>

      <section class="ai-action-panel" aria-label="AI 辅助检查">
        <div class="action-copy">
          <strong>AI 辅助检查</strong>
          <span>检查页面文字低级错误，生成待确认标记</span>
        </div>
        <div class="ai-action-buttons">
          <button id="aiSettingsOpenBtn" class="ai-settings-open" type="button">设置</button>
          <button id="aiScanBtn" class="ai-action" type="button">开始检查</button>
        </div>
      </section>

      <section class="export-actions" aria-label="导出报告">
        <div class="section-heading">
          <h2>导出报告</h2>
        </div>
        <div class="export-grid">
          <button id="exportHtmlBtn" type="button">快照 HTML</button>
          <button id="exportPdfBtn" type="button">PDF</button>
        </div>
      </section>

      <section class="page-maintenance" aria-label="页面管理">
        <button id="clearCurrentBtn" class="danger-ghost" type="button">清空当前页反馈</button>
      </section>

      <section id="aiSettingsPanel" class="ai-settings" hidden>
        <div class="section-heading">
          <h2>AI 检查设置</h2>
          <button id="aiSettingsCloseBtn" class="text-button" type="button">收起</button>
        </div>
        <label>
          <span>服务</span>
          <select id="aiProviderSelect">
            <option value="zhipu">智谱 AI</option>
            <option value="deepseek">DeepSeek</option>
            <option value="gemini">Google Gemini</option>
            <option value="mock">Mock 测试模式</option>
            <option value="custom">OpenAI-compatible</option>
          </select>
        </label>
        <p id="aiProviderHint" class="ai-provider-hint"></p>
        <label>
          <span>Base URL</span>
          <input id="aiBaseUrlInput" type="url" placeholder="https://api.deepseek.com" />
        </label>
        <label>
          <span>模型</span>
          <input id="aiModelInput" type="text" placeholder="deepseek-chat" />
        </label>
        <label>
          <span>API Key</span>
          <input id="aiApiKeyInput" type="password" placeholder="只保存在本地" autocomplete="off" />
        </label>
        <p class="ai-note">AI 检查会把抽取后的网页文本发送到你选择的服务，不上传截图；API Key 只保存在本地。Gemini 请使用独立的 Google Gemini 选项。</p>
        <button id="aiSettingsSaveBtn" class="primary" type="button">保存设置</button>
      </section>

      <section id="assistPanel" class="assist-panel" hidden>
        <div class="guide">
          <h2>使用说明</h2>
          <ol>
            <li>进入批注模式后，右下角会出现铅笔悬浮球。</li>
            <li>选择框选、标记或文本反馈，保存后自动回到浏览模式。</li>
          </ol>
        </div>

        <div class="shortcut-panel">
          <h2>快捷键</h2>
          <div class="shortcut-row"><kbd>Ctrl</kbd><kbd>Alt</kbd><kbd>1</kbd><span>框选</span></div>
          <div class="shortcut-row"><kbd>Ctrl</kbd><kbd>Alt</kbd><kbd>2</kbd><span>标记</span></div>
          <div class="shortcut-row"><kbd>Ctrl</kbd><kbd>Alt</kbd><kbd>3</kbd><span>文本</span></div>
          <div class="shortcut-row"><kbd>Ctrl</kbd><kbd>Alt</kbd><kbd>E</kbd><span>导出</span></div>
          <div class="shortcut-row is-single"><kbd>Esc</kbd><span>取消或关闭菜单</span></div>
        </div>

        <button id="guideDismissBtn" class="text-button" type="button">收起说明</button>
      </section>

      <section class="feedback-section">
        <div class="section-heading">
          <h2>反馈清单</h2>
          <span id="currentCount" class="list-count">共 0 条</span>
        </div>
        <div id="feedbackList" class="feedback-list"></div>
      </section>

      <p id="status" class="status" role="status"></p>
    </main>

    <script src="./ai-core.js"></script>
    <script src="./page-access.js"></script>
    <script src="./ai-provider.js"></script>
    <script src="./pdf.js"></script>
    <script src="./popup.js" type="module"></script>
  </body>
</html>
